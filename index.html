			<div class="col-md-8 offset-md-1 mb-5 active" id="aboutmeContent">
				<div class="container">
					<div class="row language">
						<p class="mt-2 justify"
							data-es="<b>প্রত্যয় কুমার অধিকারী</b> <a href='https://ee.iitd.ac.in/' target='_blank' class='link-dark'>আইআইটি দিল্লির ইলেকট্রিক্যাল ইঞ্জিনিয়ারিং বিভাগের</a> <i>কম্পিউটার টেকনোলজি</i> গ্রুপের একজন পিএইচডি গবেষক। বাংলাদেশে বড় হয়েছেন, <a href='https://www.ndc.edu.bd/' target='_blank' class='link-dark'>নটরডেম কলেজ, ঢাকা</a> থেকে উচ্চমাধ্যমিক শেষ করে সীমান্ত পেরিয়ে <a href='https://www.nits.ac.in/' target='_blank' class='link-dark'>এনআইটি শিলচরে</a> কম্পিউটার বিজ্ঞান ও প্রকৌশল পড়তে যান। ক্লাস আর গ্রীষ্মকালীন ইন্টার্নশিপের ফাঁকে কোনো এক সময় <a href='https://scholar.google.com/citations?user=K6ecfUwAAAAJ&amp;hl=en' target='_blank' class='link-dark'>ড. অলোক সিং</a> তাকে প্রাকৃতিক ভাষা প্রক্রিয়াকরণের সাথে পরিচয় করিয়ে দেন এবং হাতে তুলে দেন জুরাফস্কির <a href='https://web.stanford.edu/~jurafsky/slp3/' target='_blank' class='link-dark'><i>Speech and Language Processing</i></a> বইটি। তখন থেকেই তিনি ভাষা, গণনা আর মানুষের এই কারবারেই আছেন। এরপর এনআইটি শিলচর ও <a href='https://www.iitg.ac.in/' target='_blank' class='link-dark'>আইআইটি গুয়াহাটি</a>তে ইন্টার্নশিপ, কয়েক মাস <a href='https://www.iiit.ac.in/' target='_blank' class='link-dark'>ট্রিপলআইটি হায়দ্রাবাদে</a> মডেল কোয়ান্টাইজেশন নিয়ে কাজ, তারপর ২০২৪ সালে পিএইচডি শুরু।"
							data-en="<b>Prottay Kumar Adhikary</b> is a Ph.D. researcher in the <i>Computer Technology</i> group of the <a href='https://ee.iitd.ac.in/' target='_blank' class='link-dark'>Department of Electrical Engineering, IIT Delhi</a>. He grew up in Bangladesh, finished school at <a href='https://www.ndc.edu.bd/' target='_blank' class='link-dark'>Notre Dame College, Dhaka</a>, and then crossed the border to study Computer Science &amp; Engineering at <a href='https://www.nits.ac.in/' target='_blank' class='link-dark'>NIT Silchar</a>. Somewhere between classes and summer internships, <a href='https://scholar.google.com/citations?user=K6ecfUwAAAAJ&amp;hl=en' target='_blank' class='link-dark'>Dr. Alok Singh</a> introduced him to natural language processing and handed him a copy of Jurafsky's <a href='https://web.stanford.edu/~jurafsky/slp3/' target='_blank' class='link-dark'><i>Speech and Language Processing</i></a>. He has been in the business of language, computation and humans ever since. Internships at NIT Silchar and <a href='https://www.iitg.ac.in/' target='_blank' class='link-dark'>IIT Guwahati</a> followed, then a few months on model quantization at <a href='https://www.iiit.ac.in/' target='_blank' class='link-dark'>IIIT Hyderabad</a>, before he began his Ph.D. in 2024.">
						</p>
						<p class="mt-2 justify"
							data-es="মনেপ্রাণে তিনি জ্ঞানকে অ্যাপ্লাই করতে ভালোবাসেন। একটা সমস্যা হাতে পেলে সেটা সত্যিই কাজ না করা পর্যন্ত তিনি খুঁচিয়ে যান, বারবার বানান আর পরীক্ষা করেন। এই অভ্যাসটা সবচেয়ে বেশি দেখা যায় মানুষের জন্য মাইক্রোটুল বানানোর তার প্রবল টানে: এমন ছোট টুল যা একটি সমস্যা ভালোভাবে সমাধান করে, কিছু বুদ্ধিমান, বেশিরভাগই নিছক কাজের। <a href='https://thetint.co' target='_blank' class='link-dark'>দ্য টেকনোলজি-ইনফর্মড থেরাপিস্ট (TinT)</a>-এ তিনি সত্যিকার অর্থে এই কাজটি করার সুযোগ পান, থেরাপিস্টদের জন্য টুল বানান এবং বুদ্ধিমান সিস্টেম তাদের কাজে কী পারে আর কী পারে না তা বুঝতে সাহায্য করেন। ছোট পরীক্ষানিরীক্ষা আর কয়েকটি গেম পাওয়া যাবে তার <a href='tools.html' class='link-dark'>ল্যাবে</a>।"
							data-en="He is, at heart, someone who likes to apply things. Give him a problem and he will keep poking at it, rebuilding and retesting, until it actually works. That habit shows up most in his urge to build microtools for people: small tools that solve one problem well, some of them intelligent, most of them simply useful. <a href='https://thetint.co' target='_blank' class='link-dark'>The Technology-Informed Therapist (TinT)</a> is where he gets to do this for real, building for therapists and helping them make sense of what intelligent systems can and cannot do for their practice. The smaller experiments, along with a few games, live in his <a href='tools.html' class='link-dark'>Lab</a>.">
						</p>

						<h4 id="researchinterestsH4" class="mt-2" data-es="আগ্রহী গবেষণা" data-en="Research Interests">
						</h4>

						<p class="mt-1" style="text-align: justify;"
							data-es="তিনি আসলে বুঝতে চান মিথস্ক্রিয়া, আর তার ভেতর দিয়ে বয়ে যাওয়া অর্থ: একজন মানুষ যখন একটি বুদ্ধিমান সিস্টেমের সাথে কথা বলে, যখন বুদ্ধিমান সিস্টেমগুলো নিজেরাই একে অপরের সাথে কথা বলতে শুরু করে, আর যখন দুজন মানুষের কথোপকথনের মাঝখানে কোথাও একটি বুদ্ধিমান সিস্টেম বসে থাকে। এই প্রশ্নগুলো শুধু কম্পিউটার বিজ্ঞানের নয়, তাই তিনি বিভিন্ন শাখার সাথে কাজ করতে আগ্রহী: এইচসিআই গ্রুপ, ডিজিটাল হিউম্যানিটিজ, কালচারাল অ্যানালিটিক্স, এবং বুদ্ধিমান সিস্টেম ও সমাজ নিয়ে যারা কাজ করেন তাদের সাথে, আর এমন আন্তঃশাস্ত্রীয় সংযুক্তিকে তিনি সাদরে গ্রহণ করবেন।"
							data-en="What he really wants to understand is interaction, and the meaning carried through it: what happens when a person talks to an intelligent system, when intelligent systems start talking to one another, and when two people talk with an intelligent system sitting somewhere in between. These questions do not belong to computer science alone, so he is keen to work across disciplines, with HCI groups, digital humanities, cultural analytics, and people studying intelligent systems and society, and he would welcome interdisciplinary affiliations that let him do that.">
						</p>
						<p class="mt-1" style="text-align: justify;"
							data-es="স্নাতক পর্যায়ে তিন বছর এনএলপি নিয়ে কাজ করে তিনি বুঝেছিলেন, নিছক তত্ত্বের চেয়ে ভাষা প্রযুক্তি বাস্তবে কোথায় গিয়ে কাজে লাগে সেটাই তাকে বেশি টানে। থেরাপিই মনে হয়েছিল সবচেয়ে স্বাভাবিক জায়গা: মূলত এটি দুজন মানুষের কথা বলা, একজন অন্যজনকে বোঝার এবং পাশে দাঁড়ানোর চেষ্টা করছেন, আর ভাষা বোঝার দাবি করা কোনো সিস্টেমের কাছে এর চেয়ে বেশি দাবি খুব কম প্রয়োগই করে। তাই আইআইটি দিল্লিতে তার পিএইচডি মানসিক স্বাস্থ্যসেবা নিয়ে, আর এর বেশিরভাগই সমাধান বিক্রি করার চেয়ে অনুসন্ধানমূলক। বুদ্ধিমান সিস্টেম আসলে কতটা ভালোভাবে কাউন্সেলিং সেশনের সারসংক্ষেপ করে ও থেরাপি নোট লেখে, প্রাপ্ত ক্লিনিক্যাল ডেটাসেটগুলো কী ধরে আর নীরবে কী বাদ দেয়, কথোপকথনের প্রবাহ কীভাবে ঠিক করে কোনটা রাখার মতো, আর একজন রোগীর নিজের গল্পকে এমন কিছুতে রূপ দেওয়া যায় কি না যা নিয়ে একজন ক্লিনিশিয়ান ভাবতে পারেন, এসবই তিনি খতিয়ে দেখেন। মনোরোগ বিশেষজ্ঞদের সাথে মিলে তিনি দেখেন লক্ষণ, আচরণ আর চিকিৎসার প্রতিক্রিয়া ভাষায় কোথায় ধরা পড়ে, এবং এই সিস্টেমগুলো কী ভুল করে, কার ক্ষেত্রে, আর কেন। উত্তরগুলো প্রায়ই সমাধান নয়, বরং ফলাফল, আর তাতে তিনি স্বচ্ছন্দ: কোনো কিছু ঠিক কোথায় ভাঙে তা জানাই সাধারণত সেটা ঠিক করার প্রথম ধাপ।"
							data-en="Three years of NLP as an undergraduate taught him that he cared less about theory for its own sake and more about where language technology actually lands. Therapy felt like the most natural place to look: at its core it is two people talking, one trying to understand the other and offer support, and few applications ask more of a system that claims to understand language. So his Ph.D. at IIT Delhi sits in mental healthcare, and most of it is investigative rather than about selling a fix. He studies how well intelligent systems really summarise counselling sessions and write therapy notes, what the available clinical datasets cover and quietly leave out, how the flow of a conversation shapes what is worth keeping, and whether a patient's own story can be turned into something a clinician can reason with. Alongside psychiatrists, he looks at where symptoms, behaviours and treatment response surface in language, and at what these systems get wrong, for whom, and why. The answers are often findings rather than solutions, and he is comfortable with that: knowing exactly where something breaks is usually the first step to fixing it.">
						</p>
