	<script>
		// Render the Lab from tools/registry.js before main.js runs, so updateLanguage() fills the data-en/data-es text.
		(function () {
			const cats = window.LAB_CATEGORIES;
			const tools = window.LAB_TOOLS;
			const sections = document.getElementById("labSections");
			const filters = document.getElementById("labFilters");
			const search = document.getElementById("labSearch");
			const empty = document.getElementById("labEmpty");
			const attr = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");

			const filterBtn = (key, label) =>
				`<button type="button" class="btn btn-outline-dark btn-sm" data-filter="${key}" data-en="${attr(label.en)}" data-es="${attr(label.es)}"></button>`;
			filters.innerHTML = filterBtn("all", { en: "All", es: "সব" }) +
				Object.keys(cats).filter((k) => tools.some((t) => t.category === k))
					.map((k) => filterBtn(k, cats[k])).join("");

			// One grid of tiles, ordered by category; the filter buttons do the grouping.
			const ordered = Object.keys(cats).flatMap((k) => tools.filter((t) => t.category === k));
			sections.innerHTML = `<div class="lab-grid mt-3">${ordered.map((t) => `
				<a class="lab-card" href="tools/${t.id}/" title="${attr(t.desc.en)}" data-section="${t.category}"
					data-search="${attr((t.title.en + " " + t.title.es + " " + t.desc.en + " " + cats[t.category].en).toLowerCase())}">
					<i class="${t.icon} lab-card-icon" aria-hidden="true"></i>
					<div class="lab-card-title" data-en="${attr(t.title.en)}" data-es="${attr(t.title.es)}"></div>
					<div class="lab-card-desc" data-en="${attr(t.desc.en)}" data-es="${attr(t.desc.es)}"></div>
				</a>`).join("")}
			</div>`;

			let active = (location.hash || "#all").slice(1);
			if (active !== "all" && !cats[active]) active = "all";

			function apply() {
				const q = search.value.trim().toLowerCase();
				let shown = 0;
				filters.querySelectorAll("button").forEach((b) => {
					// not "active": main.js hides every .active inside .content
					const on = b.dataset.filter === active;
					b.classList.toggle("btn-dark", on);
					b.classList.toggle("btn-outline-dark", !on);
				});
				sections.querySelectorAll(".lab-card").forEach((c) => {
					const ok = (active === "all" || c.dataset.section === active) && (!q || c.dataset.search.includes(q));
					c.style.display = ok ? "" : "none";
					if (ok) shown++;
				});
				empty.classList.toggle("d-none", shown > 0);
			}

			filters.addEventListener("click", (e) => {
				const b = e.target.closest("button");
				if (!b) return;
				active = b.dataset.filter;
				history.replaceState(null, "", active === "all" ? location.pathname : "#" + active);
				apply();
			});
			search.addEventListener("input", apply);
			apply();
		})();
	</script>
